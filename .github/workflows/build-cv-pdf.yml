name: Build CV PDF

# Re-build the CV PDF whenever the CV source changes.
# Writes the latest PDF to assets/docs/Jialing_Wu_CV.pdf and a dated archive
# copy to assets/docs/archive/Jialing_Wu_CV_YYYY-MM-DD.pdf, then commits back
# to the branch that triggered the run.

on:
  push:
    branches:
      - main
      - claude/resume-manager-pdf-IXUGG
    paths:
      - '_data/cv.yml'
      - 'cv.html'
      - 'assets/css/cv.css'
      - '.github/workflows/build-cv-pdf.yml'
      - '.github/scripts/render-cv-pdf.js'
      - 'Gemfile'
      - 'Gemfile.lock'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cv-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history + write access so we can commit the PDF back
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site with Jekyll
        run: bundle exec jekyll build

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install --no-save puppeteer@22

      - name: Render CV PDF
        run: node .github/scripts/render-cv-pdf.js

      - name: Archive dated copy
        id: archive
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          mkdir -p assets/docs/archive
          cp assets/docs/Jialing_Wu_CV.pdf "assets/docs/archive/Jialing_Wu_CV_${DATE}.pdf"
          ls -la assets/docs/ assets/docs/archive/

      - name: Commit PDF (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/docs/Jialing_Wu_CV.pdf assets/docs/archive/
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Rebuild CV PDF (${{ steps.archive.outputs.date }})

          Generated by .github/workflows/build-cv-pdf.yml"
            # Retry push with exponential backoff on network failure
            for i in 1 2 3 4; do
              if git push; then
                echo "Push succeeded on attempt $i"
                exit 0
              fi
              echo "Push attempt $i failed; retrying after backoff..."
              sleep $((2 ** i))
            done
            echo "Push failed after 4 attempts" >&2
            exit 1
          fi

      - name: Upload PDF artifact (for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: Jialing_Wu_CV-${{ steps.archive.outputs.date }}
          path: assets/docs/Jialing_Wu_CV.pdf
          retention-days: 30
