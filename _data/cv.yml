research_experience:
  - date: "Aug. 2025 – Present"
    title: "Independent Research in Computational Social Science"
    location: "Columbus, OH, USA"
    role: ""
    description: ""
    bullets:
      - "Conduct a systematic literature review using the PRISMA search and screening protocol to map major research questions, analytic models, and methodological gaps in person-centered quantitative studies in STEM education."
      - "Apply large language models (LLMs) for sentiment and topic analysis on large-scale social media data to examine perceptions of pre-college robotics education and use the same analytical pipeline to analyze student comments on instructor attitudes toward AI tools and their impact on classroom dynamics."
      - "Use GIS analysis with data from the U.S. Department of Education and the U.S. Census Bureau to compare accessibility disparities across California and New York, identifying geographic inequities in school access."
      - "Use bipartite network analysis on 10 years of publications from leading journals in engineering and STEM education to identify global collaboration hubs, cross-disciplinary bridges, and emerging knowledge clusters."

  - date: "Aug. 2024 – Present"
    title: "The Ohio State University, College of Engineering"
    location: "Columbus, OH, USA"
    role: "Graduate Research Assistant (with Dr. Adam Carberry)"
    description: "The e4usa+FIRST program combines the Engineering for US All (e4usa) curriculum with FIRST Robotics, offering hands-on engineering for college and high school students."
    bullets:
      - "Lead the development of research instruments, including surveys grounded in Social Cognitive Career Theory (SCCT) and computational thinking frameworks, to assess student self-efficacy, identity, and skill development."
      - "Collect pre-test data via Google Forms to conduct initial validity checks for the survey instrument."
      - "Prepare and submit IRB applications, ensuring research protocols meet ethical standards and compliance requirements across multiple high school sites."
      - "Conducted qualitative analysis of teachers' interviews on robotics curriculum implementation, identifying facilitators and challenges to inform curriculum revisions and wrote the methods and results sections of research papers."

  - date: "June 2023 – July 2024"
    title: "Vanderbilt University, School of Engineering"
    location: "Nashville, TN, USA"
    role: "Graduate Research Assistant (with Dr. Stacy Klein-Gardner, Dr. Medha Dalal)"
    description: "Engineering for Us All (e4usa) is a first-of-its-kind, national initiative designed to introduce engineering design principles to a new generation of students."
    bullets:
      - "Investigated high school students' perspectives on engineering education courses; analyzed the relationship between students' backgrounds and career choices; conducted qualitative analysis on open-ended responses from 2022–2023 post-test surveys, developed codebooks, and performed statistical tests to compare pre- and post-test data."
      - "Explored students' opinions on using mathematical modeling tools in engineering design; analyzed focus group data and compared thematic findings with cognitive load theory to identify potential improvements in instructional design."
      - "Submitted two conference papers for the 2024 ASEE, led research group meetings, managed project timelines, and delivered presentations at conferences."
      - "Revised Unit 2 curriculum, changing the topic from water filters to wind turbines; revamped 5 lessons and 9 activities, adapted 8 lessons and 7 activities, and overhauled teaching slides and assignments. Redesigned MATLAB code and associated activities; collected teacher feedback during curriculum pilots and the new semester."
      - "Drafted memos for facilitators in summer teacher professional development programs, ensured proper formatting of Google Forms, and verified the accuracy of links for asynchronous activities on the Canvas platform."

